<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.4)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.1)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="light-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 50px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #38bdf8;
      }

      /* Dynamic Animations */
      @keyframes pulseOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
        50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.7; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      }
      @keyframes pulseOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
        50% { transform: translate(-35px, 30px) scale(1.2); opacity: 0.65; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      }
      @keyframes flowStroke {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgeBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .animated-orb-1 {
        animation: pulseOrb1 9s ease-in-out infinite;
      }
      .animated-orb-2 {
        animation: pulseOrb2 11s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 12, 12;
        animation: flowStroke 20s linear infinite;
      }
      .pill-badge {
        animation: badgeBounce 4s ease-in-out infinite;
      }
      .pill-badge-2 {
        animation: badgeBounce 4s ease-in-out infinite;
        animation-delay: -2s;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Technical Grid -->
  <g opacity="0.06">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M120,0 V420 M240,0 V420 M360,0 V420 M480,0 V420 M600,0 V420 M720,0 V420 M840,0 V420 M960,0 V420 M1080,0 V420" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs (Background depth - never obscures foreground text) -->
  <g>
    <circle class="animated-orb-1" cx="200" cy="110" r="140" fill="#6366f1" opacity="0.45" filter="url(#glow)" />
    <circle class="animated-orb-2" cx="1020" cy="300" r="170" fill="#ec4899" opacity="0.38" filter="url(#glow)" />
    <circle cx="820" cy="100" r="110" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />
  </g>

  <!-- Animated Circuit Connection Waves (Background Layer) -->
  <g fill="none" opacity="0.4">
    <path class="flow-line" d="M 50,380 C 300,320 450,420 700,360 C 950,300 1050,390 1180,340" stroke="url(#cyan-blue)" stroke-width="2.5" />
    <path class="flow-line" d="M 30,50 C 250,110 500,20 750,90 C 1000,160 1100,60 1170,110" stroke="url(#primary-grad)" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Foreground Main Title & Badges Area (Left-Aligned / Centered Structure) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Pill Tag -->
    <g transform="translate(0, 65)">
      <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="28" y="21" class="pill-text" fill="#a5b4fc">ACCELERATED CHECKOUT</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="152" class="title-text">Awesome Accelerated Checkout</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="196" class="tagline-text">Curated Open-Source &amp; SaaS Solutions for One-Click Checkout &amp; Orchestration</text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(0, 240)">
      
      <!-- Pill 1: 1-Click Checkout -->
      <g class="pill-badge" transform="translate(0, 0)">
        <rect width="175" height="38" rx="19" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
        <text x="20" y="24" class="pill-text">⚡ 1-Click Checkout</text>
      </g>

      <!-- Pill 2: Payment Routing -->
      <g class="pill-badge-2" transform="translate(190, 0)">
        <rect width="190" height="38" rx="19" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
        <text x="20" y="24" class="pill-text">🔀 Smart Orchestration</text>
      </g>

      <!-- Pill 3: Digital Wallets -->
      <g class="pill-badge" transform="translate(395, 0)">
        <rect width="165" height="38" rx="19" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
        <text x="20" y="24" class="pill-text">💳 Digital Wallets</text>
      </g>

      <!-- Pill 4: Open Infrastructure -->
      <g class="pill-badge-2" transform="translate(575, 0)">
        <rect width="180" height="38" rx="19" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
        <text x="20" y="24" class="pill-text">🌐 Open-Source Rails</text>
      </g>
    </g>

    <!-- Stats Dashboard Cards Row -->
    <g transform="translate(0, 310)">
      <!-- Card 1 -->
      <rect width="190" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.85" />
      <text x="18" y="26" class="metric-title">GLOBAL MARKET</text>
      <text x="18" y="49" class="metric-val">$18.4 Trillion</text>

      <!-- Card 2 -->
      <g transform="translate(205, 0)">
        <rect width="180" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.85" />
        <text x="18" y="26" class="metric-title">CONVERSION UPLIFT</text>
        <text x="18" y="49" class="metric-val" fill="#10b981">+7% to +50%</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(400, 0)">
        <rect width="210" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.85" />
        <text x="18" y="26" class="metric-title">ECOSYSTEM STACK</text>
        <text x="18" y="49" class="metric-val" fill="#c084fc">SaaS &amp; Self-Hosted</text>
      </g>
    </g>

  </g>
</svg>
